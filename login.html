<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Petto</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <main class="auth-box">
      <a href="index.html" class="logo grad auth-logo">Petto</a>
      <p class="auth-subtitle">Войди, чтобы продолжить общение с питомцами</p>

      <form class="auth-form" action="#" method="post" id="loginForm" novalidate>
        <input id="email" type="email" name="email" placeholder="Email" autocomplete="email">
        <small class="error" id="emailError"></small>

        <div class="password-wrap">
          <input id="password" type="password" name="password" placeholder="Пароль" autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Показать пароль">👁️</button>
        </div>
        <small class="error" id="passwordError"></small>

        <button type="submit" class="btn" id="submitBtn" disabled>
          <span class="btn-text">Войти</span>
          <span class="btn-spinner"></span>
          </button>
      </form>
  
      <p class="auth-bottom">
        Нет аккаунта? <a href="auth.html">Зарегистрироваться</a>
      </p>
    </main>
  </div>

  <div class="modal-overlay" id="successModal">
    <div class="modal">
        <div class="modal-icon">✅</div>
        <h2>Вход выполнен!</h2>
        <p>Добро пожаловать на наш сайт.</p>
        <button class="modal-btn" id="modalClose">Продолжить</button>
    </div>
</div>

  <script src="login.js" defer></script>
</body>
</html>
