<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Petto</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="icon.png" type="image/png">
</head>
<body class="auth-page">

  <main class="auth-box">

    <a href="index.html" class="logo grad auth-logo">Petto</a>

    <p class="auth-subtitle">
      Войди, чтобы продолжить общение с питомцами
    </p>

    <form class="auth-form" action="#" method="post">

      <input
        type="email"
        name="email"
        placeholder="Email"
        required
        autocomplete="email"
      >

      <input
        type="password"
        name="password"
        placeholder="Пароль"
        required
        autocomplete="current-password"
      >

      <button type="submit" class="btn">Войти</button>

    </form>

    <p class="auth-divider">или</p>

    <button class="btn btn-ghost auth-social" type="button">
      Войти через Google
    </button>

    <p class="auth-bottom">
      Нет аккаунта?
      <a href="auth.html">Зарегистрироваться</a>
    </p>

  </main>
<script src="script.js"></script>
</body>
</html>
